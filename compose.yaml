services:
  netdiag:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      NETDIAG_ASN_DB_PATH: /var/lib/netdiag/GeoLite2-ASN.mmdb
    volumes:
      - ./data:/var/lib/netdiag:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
