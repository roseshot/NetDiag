name: Go CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Show Go toolchain
        run: go version
      - name: Check formatting
        run: |
          output="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$output" ]; then
            echo "$output"
            gofmt -d $(find . -name '*.go' -not -path './vendor/*')
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Verify browser JavaScript
        run: node --check web/assets/app.js
